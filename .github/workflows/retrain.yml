name: Weekly Model Retraining

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-train.txt
          
      - name: Run model retraining
        run: python train.py
        
      - name: Commit and push updated models and data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add models/*.pkl data/raw/*.csv data/clean/*.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated model retraining via GitHub Actions"
          git push
